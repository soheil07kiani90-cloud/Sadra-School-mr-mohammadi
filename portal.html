<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه مدرسه صدرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d1420;--panel:#141d2e;--line:#273650;--gold:#d6a34a;--text:#f5f1e8;--muted:#a9b2c3;--danger:#e97878;--ok:#63c79b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#302817 0,transparent 30%),var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 30px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:13px;background:var(--gold);color:#1a2233;display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{display:block}.brand small{color:var(--muted)}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 17px;font-weight:800}.gold{background:var(--gold);color:#1a2233}.ghost{background:transparent;color:var(--gold);border:1px solid #8f6e36}.danger{color:#fff;background:#a64242}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#172237,#111a29);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 15px 35px #0003}.stat b{font-size:28px;display:block;margin-top:6px}.muted{color:var(--muted)}h1{font-size:clamp(25px,4vw,38px);margin:0 0 8px}h2{margin:0 0 15px;font-size:20px}.section{margin-top:18px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{padding:4px 9px;border-radius:999px;background:#ffffff0c;border:1px solid var(--line);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--danger)}.auth{max-width:430px;margin:7vh auto}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1}.tabs .active{background:var(--gold);color:#1a2233}.field{display:grid;gap:6px;margin:12px 0}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1220;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--gold)}.notice{padding:12px;border-radius:12px;background:#ffffff08;border:1px solid var(--line);margin-top:12px}.error{color:#ffaaaa}.hidden{display:none!important}.wide{grid-column:1/-1}.empty{color:var(--muted);padding:15px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="mark">ص</div><div><b>سامانه مدرسه صدرا</b><small>فولادشهر</small></div></div><button id="logout" class="danger hidden">خروج</button></header>
<section id="auth" class="auth card">
<h1>ورود به سامانه</h1><p class="muted">حساب دانش‌آموز، والد، دبیر یا مدیر خود را وارد کنید.</p>
<div class="tabs"><button id="loginTab" class="active">ورود</button><button id="signupTab" class="ghost">ثبت‌نام</button></div>
<form id="authForm"><div class="field"><label>ایمیل</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><div id="nameField" class="field hidden"><label>نام و نام خانوادگی</label><input id="fullName" type="text"></div><button id="submitAuth" class="gold" type="submit">ورود</button></form><div id="authMsg" class="notice hidden"></div>
</section>
<section id="app" class="hidden">
<div id="welcome"></div><div id="stats" class="grid section"></div><div id="main" class="grid section"></div>
</section>
</div>
<script>
const SUPABASE_URL='https://rapeodlvfwivxnybqgkz.supabase.co';
const SUPABASE_KEY='sb_publishable_jbDC9JxDz32upVAi1-cKTA_H-zAxR_0';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let signup=false;
const $=id=>document.getElementById(id);
$('loginTab').onclick=()=>setMode(false);$('signupTab').onclick=()=>setMode(true);
function setMode(v){signup=v;$('loginTab').classList.toggle('active',!v);$('signupTab').classList.toggle('active',v);$('nameField').classList.toggle('hidden',!v);$('submitAuth').textContent=v?'ساخت حساب':'ورود';$('authMsg').classList.add('hidden')}
$('authForm').onsubmit=async e=>{e.preventDefault();msg('در حال اتصال...',false);const email=$('email').value.trim(),password=$('password').value,fullName=$('fullName').value.trim();let r;if(signup)r=await db.auth.signUp({email,password,options:{data:{full_name:fullName}}});else r=await db.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message,true);if(signup)msg('حساب ساخته شد. اگر تأیید ایمیل فعال باشد، ایمیل خود را تأیید کنید و سپس وارد شوید.',false);else load()};
$('logout').onclick=()=>db.auth.signOut();
function msg(t,e){$('authMsg').textContent=t;$('authMsg').classList.remove('hidden');$('authMsg').classList.toggle('error',e)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function getProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',(await db.auth.getUser()).data.user.id).single();if(error)throw error;return data}
async function load(){try{const p=await getProfile();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').innerHTML=`<h1>سلام، ${esc(p.full_name||'کاربر صدرا')} 👋</h1><p class="muted">نقش: ${esc(roleFa(p.role))}</p>`;if(p.role==='student')await student(p);else if(p.role==='parent')await parent(p);else if(p.role==='teacher')await teacher(p);else await admin(p)}catch(e){console.error(e);$('auth').classList.remove('hidden');$('app').classList.add('hidden');msg('اطلاعات حساب قابل دریافت نیست. احتمالاً پروفایل شما هنوز توسط مدرسه ساخته نشده است.',true)}}
function roleFa(r){return ({student:'دانش‌آموز',parent:'والد',teacher:'دبیر',vice_principal:'معاون',principal:'مدیر',admin:'ادمین'})[r]||r}
function stat(title,value){return `<div class="card stat"><span class="muted">${title}</span><b>${value}</b></div>`}
function box(title,body){return `<div class="card wide"><h2>${title}</h2>${body||'<div class="empty">موردی ثبت نشده است.</div>'}</div>`}
async function student(p){const {data:s}=await db.from('students').select('*').eq('profile_id',p.id).single();if(!s)return fail('پروفایل دانش‌آموزی هنوز ساخته نشده است.');const {data:en}=await db.from('enrollments').select('class_id,classes(name,grade_level,academic_year)').eq('student_id',s.id);const {data:g}=await db.from('grades').select('subject,score,term,created_at').eq('student_id',s.id).order('created_at',{ascending:false});const {data:a}=await db.from('attendance').select('attendance_date,status,note').eq('student_id',s.id).order('attendance_date',{ascending:false}).limit(30);const {data:h}=await db.from('homework').select('title,description,due_date,subjects(name)').in('class_id',(en||[]).map(x=>x.class_id).filter(Boolean)).order('due_date',{ascending:true});const {data:n}=await db.from('announcements').select('title,body,published_at').eq('published',true).order('published_at',{ascending:false}).limit(10);const {data:r}=await db.from('report_cards').select('academic_year,term,storage_path,created_at').eq('student_id',s.id).order('created_at',{ascending:false});$('stats').innerHTML=stat('کلاس',en?.[0]?.classes?.name||'---')+stat('نمرات',g?.length||0)+stat('حضور ثبت‌شده',a?.length||0)+stat('کارنامه',r?.length||0);$('main').innerHTML=box('نمرات',(g||[]).map(x=>`<div class="row"><span>${esc(x.subject)}</span><strong>${esc(x.score)} / 20</strong></div>`).join(''))+box('حضور و غیاب',(a||[]).map(x=>`<div class="row"><span>${esc(x.attendance_date)}</span><span class="pill">${esc(x.status)}</span></div>`).join(''))+box('تکالیف',(h||[]).map(x=>`<div class="row"><span>${esc(x.title)}<small class="muted"> ${esc(x.subjects?.name||'')}</small></span><span>${esc(x.due_date||'بدون موعد')}</span></div>`).join(''))+box('اطلاعیه‌ها',(n||[]).map(x=>`<div class="row"><span><strong>${esc(x.title)}</strong><br><small class="muted">${esc(x.body)}</small></span><span>${esc(x.published_at?.slice(0,10)||'')}</span></div>`).join(''))+box('کارنامه',(r||[]).map(x=>`<div class="row"><span>${esc(x.academic_year||'')} - ${esc(x.term||'')}</span><span class="pill">${x.storage_path?'فایل موجود':'بدون فایل'}</span></div>`).join(''))}
async function parent(p){const {data, error}=await db.from('parent_students').select('relationship,students(id,profile_id,student_number,grade_level,field)').eq('parent_profile_id',p.id);if(error)throw error;let html='';for(const rel of data||[]){const s=rel.students;const {data:g}=await db.from('grades').select('subject,score,term').eq('student_id',s.id).order('created_at',{ascending:false}).limit(20);const {data:a}=await db.from('attendance').select('attendance_date,status').eq('student_id',s.id).order('attendance_date',{ascending:false}).limit(20);const {data:r}=await db.from('report_cards').select('academic_year,term,storage_path').eq('student_id',s.id).order('created_at',{ascending:false});html+=box('فرزند: '+esc(s.profile_id),`<p class="muted">رابطه: ${esc(rel.relationship||'والد')} | پایه: ${esc(s.grade_level||'---')} | شماره: ${esc(s.student_number||'---')}</p><h3>نمرات</h3>${(g||[]).map(x=>`<div class="row"><span>${esc(x.subject)}</span><b>${esc(x.score)} / 20</b></div>`).join('')||'<div class="empty">نمره‌ای ثبت نشده.</div>'}<h3>حضور</h3>${(a||[]).map(x=>`<div class="row"><span>${esc(x.attendance_date)}</span><span class="pill">${esc(x.status)}</span></div>`).join('')||'<div class="empty">رکوردی نیست.</div>'}<h3>کارنامه</h3>${(r||[]).map(x=>`<div class="row"><span>${esc(x.academic_year||'')} - ${esc(x.term||'')}</span><span class="pill">${x.storage_path?'موجود':'بدون فایل'}</span></div>`).join('')||'<div class="empty">کارنامه‌ای نیست.</div>'}`)}const {data:n}=await db.from('announcements').select('title,body,published_at').eq('published',true).order('published_at',{ascending:false}).limit(10);$('stats').innerHTML=stat('فرزندان',(data||[]).length)+stat('نقش',roleFa(p.role))+stat('اعلان‌ها',(n||[]).length)+stat('وضعیت','فعال');$('main').innerHTML=html+box('اطلاعیه‌ها',(n||[]).map(x=>`<div class="row"><strong>${esc(x.title)}</strong><span>${esc(x.published_at?.slice(0,10)||'')}</span></div>`).join(''))}
async function teacher(p){const {data:t}=await db.from('teachers').select('*').eq('profile_id',p.id).single();if(!t)return fail('پروفایل دبیر هنوز ساخته نشده است.');const {data:ct}=await db.from('class_teachers').select('class_id,subject_id,classes(name,grade_level),subjects(name)').eq('teacher_id',t.id);const classIds=(ct||[]).map(x=>x.class_id);const {data:h}=classIds.length?await db.from('homework').select('title,due_date,class_id,subjects(name)').eq('teacher_id',t.id).order('due_date',{ascending:false}):{data:[]};$('stats').innerHTML=stat('کلاس‌ها',(ct||[]).length)+stat('تکالیف',(h||[]).length)+stat('وضعیت','فعال')+stat('نقش','دبیر');$('main').innerHTML=box('کلاس‌های تحت تدریس',(ct||[]).map(x=>`<div class="row"><span>${esc(x.classes?.name||'کلاس')} <small class="muted">${esc(x.subjects?.name||'')}</small></span><span class="pill">پایه ${esc(x.classes?.grade_level||'')}</span></div>`).join(''))+box('تکالیف من',(h||[]).map(x=>`<div class="row"><span>${esc(x.title)} <small class="muted">${esc(x.subjects?.name||'')}</small></span><span>${esc(x.due_date||'')}</span></div>`).join(''))}
async function admin(p){const tables=['profiles','students','teachers','classes','subjects','enrollments','grades','attendance','homework','report_cards','announcements','audit_logs'];const counts={};for(const t of tables){const {count}=await db.from(t).select('*',{count:'exact',head:true});counts[t]=count||0}$('stats').innerHTML=stat('کاربران',counts.profiles)+stat('دانش‌آموزان',counts.students)+stat('دبیران',counts.teachers)+stat('کلاس‌ها',counts.classes);$('main').innerHTML=box('مدیریت سریع',tables.map(t=>`<div class="row"><span>${esc(t)}</span><strong>${counts[t]}</strong></div>`).join(''))+box('اطلاعیه‌ها','<p class="muted">مدیریت ایجاد/انتشار اطلاعیه باید از مسیر مدیریتی امن و Policyهای Supabase انجام شود.</p>')}
function fail(t){$('stats').innerHTML='';$('main').innerHTML=box('تکمیل پروفایل',`<div class="notice">${esc(t)}</div>`)}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')load();if(event==='SIGNED_OUT'){location.reload()}});
(async()=>{const {data}=await db.auth.getSession();if(data.session)load()})();
</script>
</body>
</html>
