<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل دبیر | صدرا</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d1420;color:#f5f1e8;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#141d2e;border:1px solid #273650;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #273650}button,select,input{font:inherit;border-radius:10px;padding:10px;border:1px solid #394a68;background:#0b1220;color:#fff}button{cursor:pointer;background:#d6a34a;color:#1a2233;font-weight:800}.muted{color:#a9b2c3}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}.hidden{display:none}</style></head><body><div class="wrap"><h1>پنل دبیر</h1><p class="muted">ثبت نمره و حضور و غیاب از صفحه اصلی دبیر</p><div id="app" class="card">در حال بارگذاری...</div></div><script>
const SUPABASE_URL='https://rapeodlvfwivxnybqgkz.supabase.co';
const SUPABASE_KEY='sb_publishable_jbDC9JxDz32upVAi1-cKTA_H-zAxR_0';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacher,assignments=[],students=[],selected;
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:u}=await db.auth.getUser();if(!u.user)return app('ابتدا وارد سامانه شوید.');const {data:p}=await db.from('profiles').select('*').eq('id',u.user.id).single();if(p?.role!=='teacher')return app('این صفحه فقط برای دبیران است.');const {data:t}=await db.from('teachers').select('*').eq('profile_id',p.id).single();if(!t)return app('پروفایل دبیر پیدا نشد.');teacher=t;const {data:ct,error}=await db.from('class_teachers').select('class_id,teacher_id,subject_id,classes(name,grade_level),subjects(id,name)').eq('teacher_id',t.id);if(error)return app(error.message);assignments=ct||[];render();}
function app(x){document.getElementById('app').innerHTML='<p>'+esc(x)+'</p>'}
function render(){document.getElementById('app').innerHTML='<h2>کلاس‌های من</h2>'+assignments.map((a,i)=>`<div class="card"><b>${esc(a.classes?.name||'کلاس')}</b><span class="muted"> | ${esc(a.subjects?.name||'درس')}</span><button onclick="openClass(${i})">ثبت نمره / حضور</button></div>`).join('')||'<p class="muted">کلاسی برای شما تخصیص داده نشده است.</p>'}
async function openClass(i){selected=assignments[i];const {data:en,error}=await db.from('enrollments').select('student_id,students(id,student_number,profile_id)').eq('class_id',selected.class_id);if(error)return app(error.message);students=(en||[]).map(x=>x.students).filter(Boolean);const ids=students.map(s=>s.profile_id).filter(Boolean);const pr=ids.length?await db.from('profiles').select('id,full_name').in('id',ids):{data:[]};const names=new Map((pr.data||[]).map(x=>[x.id,x.full_name]));document.getElementById('app').innerHTML=`<h2>${esc(selected.classes?.name)} | ${esc(selected.subjects?.name)}</h2><div class="grid"><label>نوبت<select id="term"><option>نوبت اول</option><option>نوبت دوم</option><option>مستمر</option></select></label><label>تاریخ حضور<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><span></span></div><div class="card">${students.map(s=>`<div class="row"><span><b>${esc(names.get(s.profile_id)||s.profile_id||'دانش‌آموز')}</b><small class="muted"> ${esc(s.student_number||'')}</small></span><input class="score" data-student="${s.id}" type="number" min="0" max="20" step="0.01" placeholder="نمره"><select class="att" data-student="${s.id}"><option value="present">حاضر</option><option value="absent">غایب</option><option value="late">تاخیر</option><option value="excused">موجه</option></select></div>`).join('')}</div><button onclick="saveGrades()">ذخیره نمرات</button> <button onclick="saveAttendance()">ذخیره حضور و غیاب</button> <button onclick="render()">بازگشت</button><p id="msg"></p>`}
async function saveGrades(){const term=document.getElementById('term').value;for(const el of document.querySelectorAll('.score')){if(el.value==='')continue;const score=Number(el.value);if(score<0||score>20)return status('نمره باید بین ۰ و ۲۰ باشد.',true);const r=await db.from('grades').insert({student_id:el.dataset.student,class_id:selected.class_id,teacher_id:teacher.id,subject_id:selected.subject_id,subject:selected.subjects?.name||'',score,term});if(r.error)return status(r.error.message,true)}status('نمرات با موفقیت ثبت شدند.')}
async function saveAttendance(){const date=document.getElementById('date').value;for(const el of document.querySelectorAll('.att')){const payload={student_id:el.dataset.student,class_id:selected.class_id,teacher_id:teacher.id,attendance_date:date,status:el.value};const old=await db.from('attendance').select('id').eq('student_id',el.dataset.student).eq('class_id',selected.class_id).eq('attendance_date',date).maybeSingle();const r=old.data?.id?await db.from('attendance').update(payload).eq('id',old.data.id):await db.from('attendance').insert(payload);if(r.error)return status(r.error.message,true)}status('حضور و غیاب با موفقیت ثبت شد.')}
function status(t,e){const x=document.getElementById('msg');if(x){x.textContent=t;x.style.color=e?'#e97878':'#63c79b'}}
init();
</script></body></html>
